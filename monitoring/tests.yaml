# Scénarios promtool. scripts/check-monitoring.py ajoute les annotations attendues
# depuis les règles rendues, sans modifier les valeurs, labels ou délais ci-dessous.
evaluation_interval: 30s
tests:
- name: Deployment waits three minutes, fires and recovers
  interval: 30s
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="otel-demo",deployment="checkout"}'
    values: '0+0x7 1+0x8'
  - series: 'kube_deployment_spec_replicas{namespace="otel-demo",deployment="checkout"}'
    values: '1+0x16'
  alert_rule_test:
  - eval_time: 2m30s
    alertname: KubeDeploymentUnavailable
    exp_alerts: []
  - eval_time: 3m
    alertname: KubeDeploymentUnavailable
    exp_alerts:
    - exp_labels: {namespace: otel-demo, deployment: checkout, service_name: checkout, severity: critical}
  - eval_time: 4m30s
    alertname: KubeDeploymentUnavailable
    exp_alerts: []
- name: A healthy or intentionally scaled-down deployment does not alert
  interval: 30s
  input_series:
  - series: 'kube_deployment_status_replicas_available{namespace="otel-demo",deployment="checkout"}'
    values: '1+0x30'
  - series: 'kube_deployment_spec_replicas{namespace="otel-demo",deployment="checkout"}'
    values: '1+0x30'
  - series: 'kube_deployment_status_replicas_available{namespace="otel-demo",deployment="disabled"}'
    values: '0+0x30'
  - series: 'kube_deployment_spec_replicas{namespace="otel-demo",deployment="disabled"}'
    values: '0+0x30'
  alert_rule_test:
  - eval_time: 10m
    alertname: KubeDeploymentUnavailable
    exp_alerts: []
- name: Sustained server errors trigger after five minutes
  interval: 30s
  input_series:
  - series: 'traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}'
    values: '0+6x30'
  - series: 'traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_UNSET"}'
    values: '0+54x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: ApplicationHighErrorRate
    exp_alerts: []
  - eval_time: 6m
    alertname: ApplicationHighErrorRate
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: checkout, severity: critical}
- name: Low traffic and client-side errors do not page
  interval: 30s
  input_series:
  - series: 'traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}'
    values: '0+0.5x30'
  - series: 'traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_CLIENT",status_code="STATUS_CODE_ERROR"}'
    values: '0+100x30'
  - series: 'traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_UNSET"}'
    values: '0+100x30'
  alert_rule_test:
  - eval_time: 10m
    alertname: ApplicationHighErrorRate
    exp_alerts: []
- name: p95 latency uses milliseconds and the traffic guard
  interval: 30s
  input_series:
  - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="frontend",span_kind="SPAN_KIND_SERVER",le="1000"}'
    values: '0+80x30'
  - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="frontend",span_kind="SPAN_KIND_SERVER",le="2000"}'
    values: '0+100x30'
  - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="frontend",span_kind="SPAN_KIND_SERVER",le="+Inf"}'
    values: '0+100x30'
  - series: 'traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_UNSET"}'
    values: '0+100x30'
  - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="checkout",span_kind="SPAN_KIND_SERVER",le="1000"}'
    values: '0+0x30'
  - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="checkout",span_kind="SPAN_KIND_SERVER",le="2000"}'
    values: '0+0.5x30'
  - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="checkout",span_kind="SPAN_KIND_SERVER",le="+Inf"}'
    values: '0+0.5x30'
  - series: 'traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_UNSET"}'
    values: '0+0.5x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: ApplicationHighLatency
    exp_alerts: []
  - eval_time: 6m
    alertname: ApplicationHighLatency
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: frontend, severity: warning}
- name: Healthy HTTP probes do not alert
  interval: 30s
  input_series:
  - series: 'httpcheck_status{service_name="frontend-proxy",http_status_class="2xx",http_status_code="200"}'
    values: '1+0x30'
  alert_rule_test:
  - eval_time: 10m
    alertname: WebstoreUnavailable
    exp_alerts: []
- name: HTTP failure fires and recovers despite changed status-code labels
  interval: 30s
  input_series:
  - series: 'httpcheck_status{service_name="frontend-proxy",http_status_class="2xx",http_status_code="200"}'
    values: '1 _ _ _ _ _ _ _ _ _ 1+0x8'
  - series: 'httpcheck_status{service_name="frontend-proxy",http_status_class="2xx"}'
    values: '_ 0+0x8 stale'
  alert_rule_test:
  - eval_time: 2m
    alertname: WebstoreUnavailable
    exp_alerts: []
  - eval_time: 4m30s
    alertname: WebstoreUnavailable
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: frontend-proxy, severity: critical}
  - eval_time: 5m30s
    alertname: WebstoreUnavailable
    exp_alerts: []
- name: Missing HTTP probes are a fault, not healthy
  alert_rule_test:
  - eval_time: 3m
    alertname: WebstoreUnavailable
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: frontend-proxy, severity: critical}
- name: A failed probe disappearing must not resolve or change the alert identity
  interval: 30s
  input_series:
  - series: 'httpcheck_status{service_name="frontend-proxy",http_status_class="2xx"}'
    values: '0+0x5 stale'
  alert_rule_test:
  - eval_time: 2m
    alertname: WebstoreUnavailable
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: frontend-proxy, severity: critical}
  - eval_time: 4m
    alertname: WebstoreUnavailable
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: frontend-proxy, severity: critical}
  - eval_time: 6m
    alertname: WebstoreUnavailable
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: frontend-proxy, severity: critical}
- name: Telemetry disappearance is detected per service
  interval: 30s
  input_series:
  - series: 'traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER"}'
    values: '0+1x30'
  - series: 'traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER"}'
    values: '0+1x4 stale'
  alert_rule_test:
  - eval_time: 6m
    alertname: ApplicationTelemetryMissing
    exp_alerts: []
  - eval_time: 10m
    alertname: ApplicationTelemetryMissing
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: checkout, span_kind: SPAN_KIND_SERVER, severity: warning}
- name: CrashLoopBackOff persists before alerting
  interval: 30s
  input_series:
  - series: 'kube_pod_container_status_waiting_reason{namespace="otel-demo",pod="cart-abc",container="cart",reason="CrashLoopBackOff"}'
    values: '1+0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: KubePodCrashLooping
    exp_alerts: []
  - eval_time: 5m
    alertname: KubePodCrashLooping
    exp_alerts:
    - exp_labels: {namespace: otel-demo, pod: cart-abc, container: cart, severity: warning}
- name: Node faults and pressure have separate severities
  interval: 30s
  input_series:
  - series: 'kube_node_status_condition{node="otel-demo",condition="Ready",status="true"}'
    values: '0+0x30'
  - series: 'kube_node_status_condition{node="otel-demo",condition="MemoryPressure",status="true"}'
    values: '1+0x30'
  alert_rule_test:
  - eval_time: 3m
    alertname: KubeNodeNotReady
    exp_alerts:
    - exp_labels: {node: otel-demo, condition: Ready, status: 'true', namespace: otel-demo, service_name: kubernetes, severity: critical}
  - eval_time: 5m
    alertname: KubeNodePressure
    exp_alerts:
    - exp_labels: {node: otel-demo, condition: MemoryPressure, status: 'true', namespace: otel-demo, service_name: kubernetes, severity: warning}
- name: Collector agent availability is independent of its own telemetry
  interval: 30s
  input_series:
  - series: 'kube_daemonset_status_number_ready{namespace="otel-demo",daemonset="otel-collector-agent"}'
    values: '0+0x20'
  - series: 'kube_daemonset_status_desired_number_scheduled{namespace="otel-demo",daemonset="otel-collector-agent"}'
    values: '1+0x20'
  alert_rule_test:
  - eval_time: 3m
    alertname: KubeCollectorUnavailable
    exp_alerts:
    - exp_labels: {namespace: otel-demo, daemonset: otel-collector-agent, service_name: otel-collector, severity: critical}
- name: Collector silence and exporter backlog are detected
  interval: 30s
  input_series:
  - series: 'otelcol_exporter_queue_size{service_name="otelcol-contrib",k8s_namespace_name="otel-demo",exporter="otlp_grpc/jaeger"}'
    values: '90+0x20'
  - series: 'otelcol_exporter_queue_capacity{service_name="otelcol-contrib",k8s_namespace_name="otel-demo",exporter="otlp_grpc/jaeger"}'
    values: '100+0x20'
  alert_rule_test:
  - eval_time: 3m
    alertname: CollectorTelemetryMissing
    exp_alerts:
    - exp_labels: {namespace: otel-demo, k8s_namespace_name: otel-demo, service_name: otel-collector, severity: critical}
  - eval_time: 5m
    alertname: CollectorQueueSaturated
    exp_alerts:
    - exp_labels: {namespace: otel-demo, exporter: otlp_grpc/jaeger, service_name: otel-collector, severity: warning}
- name: Both scrape failure and disappearing target are detected
  interval: 30s
  input_series:
  - series: 'up{job="kubernetes-api-servers"}'
    values: '1+0x20'
  - series: 'up{job="kubernetes-nodes"}'
    values: '1+0x20'
  - series: 'up{job="kubernetes-nodes-cadvisor"}'
    values: '1+0x20'
  - series: 'up{job="alertmanager",instance="alertmanager:9093"}'
    values: '0+0x20'
  alert_rule_test:
  - eval_time: 2m
    alertname: MonitoringTargetDown
    exp_alerts:
    - exp_labels: {namespace: otel-demo, job: alertmanager, instance: 'alertmanager:9093', service_name: monitoring, severity: critical}
    - exp_labels: {namespace: otel-demo, job: kube-state-metrics, service_name: monitoring, severity: critical}
- name: Prometheus configuration and rule failures are visible
  interval: 30s
  input_series:
  - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",rule_group="application"}'
    values: '0+1x20'
  - series: 'prometheus_config_last_reload_successful{job="prometheus"}'
    values: '0+0x20'
  alert_rule_test:
  - eval_time: 2m
    alertname: PrometheusRuleEvaluationFailures
    exp_alerts:
    - exp_labels: {namespace: otel-demo, job: prometheus, rule_group: application, service_name: prometheus, severity: critical}
  - eval_time: 2m
    alertname: PrometheusConfigReloadFailed
    exp_alerts:
    - exp_labels: {namespace: otel-demo, job: prometheus, service_name: prometheus, severity: critical}
- name: Watchdog is intentionally always firing
  alert_rule_test:
  - eval_time: 0m
    alertname: Watchdog
    exp_alerts:
    - exp_labels: {namespace: otel-demo, service_name: monitoring, severity: info}

# Couverture applicative étendue et anomalies du cluster.
- name: KubeDeploymentReplicasMismatch waits, fires and recovers
  interval: 30s
  input_series:
  - series: kube_deployment_status_replicas_available{namespace="kube-system",deployment="coredns"}
    values: 1+0x40 2+0x50
  - series: kube_deployment_spec_replicas{namespace="kube-system",deployment="coredns"}
    values: 2+0x40 2+0x50
  alert_rule_test:
  - eval_time: 570s
    alertname: KubeDeploymentReplicasMismatch
    exp_alerts: []
  - eval_time: 10m
    alertname: KubeDeploymentReplicasMismatch
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        deployment: coredns
  - eval_time: 35m
    alertname: KubeDeploymentReplicasMismatch
    exp_alerts: []
- name: KubeDeploymentReplicasMismatch healthy boundary does not alert
  interval: 30s
  input_series:
  - series: kube_deployment_status_replicas_available{namespace="kube-system",deployment="coredns"}
    values: 0+0x80
  - series: kube_deployment_spec_replicas{namespace="kube-system",deployment="coredns"}
    values: 0+0x80
  alert_rule_test:
  - eval_time: 30m
    alertname: KubeDeploymentReplicasMismatch
    exp_alerts: []
- name: KubeStatefulSetReplicasMismatch waits, fires and recovers
  interval: 30s
  input_series:
  - series: kube_statefulset_status_replicas_ready{namespace="otel-demo",statefulset="alertmanager"}
    values: 0+0x40 1+0x50
  - series: kube_statefulset_replicas{namespace="otel-demo",statefulset="alertmanager"}
    values: 1+0x40 1+0x50
  alert_rule_test:
  - eval_time: 270s
    alertname: KubeStatefulSetReplicasMismatch
    exp_alerts: []
  - eval_time: 5m
    alertname: KubeStatefulSetReplicasMismatch
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: otel-demo
        statefulset: alertmanager
  - eval_time: 35m
    alertname: KubeStatefulSetReplicasMismatch
    exp_alerts: []
- name: KubeStatefulSetReplicasMismatch healthy boundary does not alert
  interval: 30s
  input_series:
  - series: kube_statefulset_status_replicas_ready{namespace="otel-demo",statefulset="alertmanager"}
    values: 0+0x80
  - series: kube_statefulset_replicas{namespace="otel-demo",statefulset="alertmanager"}
    values: 0+0x80
  alert_rule_test:
  - eval_time: 30m
    alertname: KubeStatefulSetReplicasMismatch
    exp_alerts: []
- name: KubeDaemonSetUnavailable waits, fires and recovers
  interval: 30s
  input_series:
  - series: kube_daemonset_status_number_ready{namespace="kube-system",daemonset="kube-proxy"}
    values: 0+0x40 1+0x50
  - series: kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="kube-proxy"}
    values: 1+0x40 1+0x50
  alert_rule_test:
  - eval_time: 270s
    alertname: KubeDaemonSetUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: KubeDaemonSetUnavailable
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        daemonset: kube-proxy
  - eval_time: 35m
    alertname: KubeDaemonSetUnavailable
    exp_alerts: []
- name: KubeDaemonSetUnavailable healthy boundary does not alert
  interval: 30s
  input_series:
  - series: kube_daemonset_status_number_ready{namespace="kube-system",daemonset="kube-proxy"}
    values: 1+0x80
  - series: kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="kube-proxy"}
    values: 1+0x80
  alert_rule_test:
  - eval_time: 30m
    alertname: KubeDaemonSetUnavailable
    exp_alerts: []
- name: KubePodNotReady waits, fires and recovers
  interval: 30s
  input_series:
  - series: kube_pod_status_ready{namespace="kube-system",pod="dns-abc",condition="true"}
    values: 0+0x40 1+0x50
  - series: kube_pod_status_phase{namespace="kube-system",pod="dns-abc",phase="Pending"}
    values: 1+0x40 0+0x50
  alert_rule_test:
  - eval_time: 570s
    alertname: KubePodNotReady
    exp_alerts: []
  - eval_time: 10m
    alertname: KubePodNotReady
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        pod: dns-abc
  - eval_time: 35m
    alertname: KubePodNotReady
    exp_alerts: []
- name: KubePodNotReady healthy boundary does not alert
  interval: 30s
  input_series:
  - series: kube_pod_status_ready{namespace="kube-system",pod="dns-abc",condition="true"}
    values: 0+0x80
  - series: kube_pod_status_phase{namespace="kube-system",pod="dns-abc",phase="Succeeded"}
    values: 1+0x80
  alert_rule_test:
  - eval_time: 30m
    alertname: KubePodNotReady
    exp_alerts: []
- name: KubeContainerWaiting waits, fires and recovers
  interval: 30s
  input_series:
  - series: kube_pod_init_container_status_waiting_reason{namespace="kube-system",pod="dns-abc",container="dns",reason="ImagePullBackOff"}
    values: 1+0x40 0+0x50
  alert_rule_test:
  - eval_time: 270s
    alertname: KubeContainerWaiting
    exp_alerts: []
  - eval_time: 5m
    alertname: KubeContainerWaiting
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        pod: dns-abc
        container: dns
        reason: ImagePullBackOff
  - eval_time: 35m
    alertname: KubeContainerWaiting
    exp_alerts: []
- name: KubeContainerWaiting healthy boundary does not alert
  interval: 30s
  input_series:
  - series: kube_pod_container_status_waiting_reason{namespace="kube-system",pod="dns-abc",container="dns",reason="ContainerCreating"}
    values: 1+0x80
  alert_rule_test:
  - eval_time: 30m
    alertname: KubeContainerWaiting
    exp_alerts: []
- name: Restarts outside application namespace fire then age out
  interval: 30s
  input_series:
  - series: kube_pod_container_status_restarts_total{namespace="kube-system",pod="dns-abc",container="dns"}
    values: 0+0x10 3+0x70
  alert_rule_test:
  - eval_time: 6m
    alertname: KubeContainerRestarts
    exp_alerts: []
  - eval_time: 8m
    alertname: KubeContainerRestarts
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        pod: dns-abc
        container: dns
  - eval_time: 25m
    alertname: KubeContainerRestarts
    exp_alerts: []
- name: Counter reset and single restart do not trigger restart storm
  interval: 30s
  input_series:
  - series: kube_pod_container_status_restarts_total{namespace="kube-system",pod="dns-abc",container="dns"}
    values: 10+0x10 0 1+0x70
  alert_rule_test:
  - eval_time: 15m
    alertname: KubeContainerRestarts
    exp_alerts: []
- name: OOM event alerts immediately but historical last termination expires
  interval: 30s
  input_series:
  - series: kube_pod_container_status_last_terminated_reason{namespace="kube-system",pod="dns-abc",container="dns",reason="OOMKilled"}
    values: 0+0x19 1+0x40
  - series: kube_pod_container_status_last_terminated_timestamp{namespace="kube-system",pod="dns-abc",container="dns"}
    values: 0+0x19 600+0x40
  alert_rule_test:
  - eval_time: 9m
    alertname: KubeContainerOOMKilled
    exp_alerts: []
  - eval_time: 10m
    alertname: KubeContainerOOMKilled
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        pod: dns-abc
        container: dns
  - eval_time: 20m
    alertname: KubeContainerOOMKilled
    exp_alerts: []
- name: KubeContainerMemoryNearLimit waits, fires and recovers
  interval: 30s
  input_series:
  - series: container_memory_working_set_bytes{namespace="kube-system",pod="dns-abc",container="dns",job="kubernetes-nodes-cadvisor"}
    values: 950+0x40 500+0x50
  - series: kube_pod_container_resource_limits{namespace="kube-system",pod="dns-abc",container="dns",resource="memory",unit="byte"}
    values: 1000+0x40 1000+0x50
  alert_rule_test:
  - eval_time: 570s
    alertname: KubeContainerMemoryNearLimit
    exp_alerts: []
  - eval_time: 10m
    alertname: KubeContainerMemoryNearLimit
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        pod: dns-abc
        container: dns
  - eval_time: 35m
    alertname: KubeContainerMemoryNearLimit
    exp_alerts: []
- name: KubeContainerMemoryNearLimit healthy boundary does not alert
  interval: 30s
  input_series:
  - series: container_memory_working_set_bytes{namespace="kube-system",pod="dns-abc",container="dns",job="kubernetes-nodes-cadvisor"}
    values: 950+0x80
  - series: kube_pod_container_resource_limits{namespace="kube-system",pod="dns-abc",container="dns",resource="memory",unit="byte"}
    values: 0+0x80
  alert_rule_test:
  - eval_time: 30m
    alertname: KubeContainerMemoryNearLimit
    exp_alerts: []
- name: CPU throttling persists before firing and clears after recovery
  interval: 30s
  input_series:
  - series: container_cpu_cfs_throttled_periods_total{namespace="kube-system",pod="dns-abc",container="dns",job="kubernetes-nodes-cadvisor"}
    values: 0+40x40 1600+0x40
  - series: container_cpu_cfs_periods_total{namespace="kube-system",pod="dns-abc",container="dns",job="kubernetes-nodes-cadvisor"}
    values: 0+100x81
  alert_rule_test:
  - eval_time: 10m
    alertname: KubeContainerCPUThrottling
    exp_alerts: []
  - eval_time: 11m
    alertname: KubeContainerCPUThrottling
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kube-system
        pod: dns-abc
        container: dns
  - eval_time: 26m
    alertname: KubeContainerCPUThrottling
    exp_alerts: []
- name: Idle containers and exactly 25 percent throttling do not alert
  interval: 30s
  input_series:
  - series: 'container_cpu_cfs_throttled_periods_total{namespace="otel-demo",pod="idle",container="app",job="kubernetes-nodes-cadvisor"}'
    values: '0+0x60'
  - series: 'container_cpu_cfs_periods_total{namespace="otel-demo",pod="idle",container="app",job="kubernetes-nodes-cadvisor"}'
    values: '0+0x60'
  - series: container_cpu_cfs_throttled_periods_total{namespace="kube-system",pod="dns-abc",container="dns",job="kubernetes-nodes-cadvisor"}
    values: 0+25x60
  - series: container_cpu_cfs_periods_total{namespace="kube-system",pod="dns-abc",container="dns",job="kubernetes-nodes-cadvisor"}
    values: 0+100x60
  alert_rule_test:
  - eval_time: 25m
    alertname: KubeContainerCPUThrottling
    exp_alerts: []
- name: KubeNodeCPUHigh waits, fires and recovers
  interval: 30s
  input_series:
  - series: k8s_node_cpu_usage{k8s_node_name="otel-demo",host_name="agent-abc"}
    values: 11+0x40 4+0x50
  - series: kube_node_status_capacity{node="otel-demo",resource="cpu",unit="core",job="kube-state-metrics"}
    values: 12+0x40 12+0x50
  alert_rule_test:
  - eval_time: 870s
    alertname: KubeNodeCPUHigh
