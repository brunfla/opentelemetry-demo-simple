# Values de la release otel-demo, exportées le 2026-11-02.
# Le certificat public et hostAliases ciblent le Minikube local otel-demo.
default:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  envOverrides:
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: service.version={{ .Chart.AppVersion }},service.namespace=opentelemetry-demo,deployment.environment.name=local,k8s.cluster.name=otel-demo
components:
  agent:
    enabled: false
  chatbot:
    enabled: false
  mcp:
    enabled: false
  frontend-proxy:
    service:
      type: NodePort
      port: 8080
      nodePort: 30080
  astronomy-db:
    imageOverride:
      repository: postgres
      tag: '18.6'
  valkey-cart:
    imageOverride:
      repository: ghcr.io/valkey-io/valkey
      tag: 9.1.2-alpine3.24
  accounting:
    initContainers:
    - name: wait-for-kafka
      image: docker.io/library/busybox:1.38.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
      imagePullPolicy: IfNotPresent
    enabled: false
  cart:
    initContainers:
    - name: wait-for-valkey-cart
      image: docker.io/library/busybox:1.38.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;
      imagePullPolicy: IfNotPresent
  checkout:
    initContainers: []
    envOverrides:
    - name: KAFKA_ADDR
      value: ''
    - name: KAFKA_TOPIC
      value: ''
  fraud-detection:
    initContainers:
    - name: wait-for-kafka
      image: docker.io/library/busybox:1.38.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
      imagePullPolicy: IfNotPresent
    enabled: false
  product-catalog:
    initContainers:
    - name: wait-for-astronomy-db
      image: docker.io/library/busybox:1.38.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;
      imagePullPolicy: IfNotPresent
  shipping:
    initContainers:
    - name: wait-for-flagd
      image: docker.io/library/busybox:1.38.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;
      imagePullPolicy: IfNotPresent
  flagd:
    initContainers:
    - name: init-config
      image: docker.io/library/busybox:1.38.0
      command:
      - sh
      - -c
      - cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json
      volumeMounts:
      - mountPath: /config-ro
        name: config-ro
      - mountPath: /config-rw
        name: config-rw
      imagePullPolicy: IfNotPresent
  kafka:
    enabled: false
  telemetry-docs:
    enabled: false
opentelemetry-collector:
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.160.0
    pullPolicy: IfNotPresent
  hostAliases:
  - ip: 192.168.49.2
    hostnames:
    - otel-demo
  extraVolumes:
  - name: kubelet-ca
    configMap:
      name: minikube-kubelet-ca
