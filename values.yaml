  alternateConfig:
    connectors:
      span_metrics: {}
    exporters:
      debug: {}
      otlp_grpc/firepit:
        endpoint: firepit:4317
        tls:
          insecure: true
      otlp_grpc/jaeger:
        endpoint: jaeger:4317
        sending_queue:
          batch: {}
        tls:
          insecure: true
      otlp_http/prometheus:
        endpoint: http://prometheus:9090/api/v1/otlp
        sending_queue:
          batch: {}
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      opamp:
        agent_description:
          include_resource_attributes: true
          non_identifying_attributes:
            demo.collector.role: gateway
            deployment.environment.name: demo
        capabilities:
          reports_available_components: true
          reports_effective_config: true
          reports_health: true
        instance_uid: 00000000-0000-7000-8000-000000000001
        server:
          ws:
            endpoint: ws://opamp-server:4320/v1/opamp
    processors:
      batch: {}
      filter/sanitize_profiles:
        error_mode: ignore
        profiles:
          profile:
          - IsMatch(resource.attributes["service.name"], "containerd-shim-.*")
      gen_ai_normalizer:
        sources:
        - name: openllmetry
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      redaction:
        allow_all_keys: true
        blocked_key_patterns:
        - demo\.payment\.card_pin
        - password
        - secret
        ignored_keys:
        - demo.payment.card_number
        summary: info
      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
      resource_detection:
        detectors:
        - env
        - system
      transform/redact_sensitive_data:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - delete_key(attributes, "demo.payment.card_cvv") where attributes["demo.payment.card_cvv"] != nil
          - set(attributes["user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
          - delete_key(attributes, "user.email") where attributes["user.email"] != nil
          - replace_pattern(attributes["demo.payment.card_number"], "^\\d{4}-\\d{4}-\\d{4}-", "****-****-****-") where attributes["demo.payment.card_number"]
            != nil
      transform/sanitize_logs:
        error_mode: ignore
        log_statements:
        - context: scope
          statements:
          - set(attributes["otelcol_signal"], attributes["otelcol.signal"]) where attributes["otelcol.signal"] != nil and
            not IsMap(attributes["otelcol.signal"])
          - delete_key(attributes, "otelcol.signal") where attributes["otelcol_signal"] != nil
      transform/sanitize_spans:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - set_semconv_span_name("1.43.0", "original_span_name")
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      kubeletstats:
        ca_file: /etc/otel/kubelet-ca/ca.crt
        endpoint: https://${env:K8S_NODE_NAME}:10250
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            cors:
              allowed_headers:
              - content-type
              - traceparent
              - baggage
              allowed_origins:
              - http://*
              - https://*
            endpoint: ${env:MY_POD_IP}:4318
      prometheus:
        config:
          scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
            - targets:
              - ${env:MY_POD_IP}:8888
      prometheus/ad:
        config:
          scrape_configs:
          - job_name: ad
            scrape_interval: 10s
            static_configs:
            - targets:
              - ad:9465
      zipkin:
        endpoint: ${env:MY_POD_IP}:9411
    service:
      extensions:
      - health_check
      - opamp
      pipelines:
        logs:
          exporters:
          - debug
          processors:
          - memory_limiter
          - resource_detection
          - resource
          - transform/sanitize_logs
          receivers:
          - otlp
        metrics:
          exporters:
          - otlp_http/prometheus
          - debug
          processors:
          - memory_limiter
          - resource_detection
          - resource
          receivers:
          - otlp
          - span_metrics
          - prometheus/ad
        profiles:
          exporters:
          - otlp_grpc/firepit
          - debug
          processors:
          - memory_limiter
          - resource_detection
          - resource
          - filter/sanitize_profiles
          receivers:
          - otlp
        traces:
          exporters:
          - otlp_grpc/jaeger
          - debug
          - span_metrics
          processors:
          - memory_limiter
          - resource_detection
          - resource
          - transform/sanitize_spans
          - gen_ai_normalizer
          - transform/redact_sensitive_data
          - redaction
          receivers:
          - otlp
          - jaeger
          - zipkin
      telemetry:
        logs:
          processors:
          - batch:
              exporter:
                otlp:
                  endpoint: http://otel-collector:4318
                  insecure: true
                  protocol: http/protobuf
        metrics:
          level: detailed
          readers:
          - periodic:
              exporter:
                otlp:
                  endpoint: http://otel-collector:4318
                  insecure: true
                  protocol: http/protobuf
              interval: 10000
              timeout: 5000
        resource:
          host.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
prometheus:
  enabled: true
  server:
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.13.3
      pullPolicy: IfNotPresent
    service:
      type: NodePort
      servicePort: 9090
      nodePort: 30090
grafana:
  enabled: true
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.2.1
    pullPolicy: IfNotPresent
  grafana.ini:
    feature_toggles:
      enable: jaegerEnableGrpcEndpoint
  sidecar:
    datasources:
      enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        uid: webstore-metrics
        type: prometheus
        url: http://prometheus:9090
        editable: true
        isDefault: true
        jsonData:
          timeInterval: 60s
          manageAlerts: true
          prometheusType: Prometheus
          prometheusVersion: 3.13.3
          exemplarTraceIdDestinations:
          - datasourceUid: webstore-traces
            name: trace_id
          - url: http://localhost:8080/jaeger/ui/trace/$${__value.raw}
            name: trace_id
            urlDisplayLabel: View in Jaeger UI
      - name: Jaeger
        uid: webstore-traces
        type: jaeger
        url: http://jaeger:16686/jaeger/ui
        editable: true
        isDefault: false
        jsonData: {}
      - name: Alertmanager
        uid: webstore-alertmanager
        type: alertmanager
        access: proxy
        url: http://alertmanager:9093
        editable: false
        isDefault: false
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
  deploymentStrategy:
    type: Recreate
  plugins: []
jaeger:
  jaeger:
    image:
      registry: quay.io
      repository: jaegertracing/jaeger
      tag: 2.21.0
      pullPolicy: IfNotPresent
opensearch:
  image:
    repository: ghcr.io/open-telemetry/demo
    tag: latest-opensearch
    pullPolicy: IfNotPresent
  majorVersion: '3'
  enabled: false
