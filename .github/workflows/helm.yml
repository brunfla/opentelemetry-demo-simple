name: Helm CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - values.yaml
      - deployment-profile
      - profiles/**
      - scripts/prepare-profile.py
      - scripts/check-test-profile.py
      - monitoring/**
      - scripts/check-monitoring.py
      - scripts/smoke-alerting.py
      - .github/workflows/helm.yml
  push:
    branches: [main]
    paths:
      - values.yaml
      - deployment-profile
      - profiles/**
      - scripts/prepare-profile.py
      - scripts/check-test-profile.py
      - monitoring/**
      - scripts/check-monitoring.py
      - scripts/smoke-alerting.py
      - .github/workflows/helm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v4.3.1
  CHART_VERSION: 0.42.6
  CHART_REPOSITORY: https://open-telemetry.github.io/opentelemetry-helm-charts
  RELEASE: otel-demo
  NAMESPACE: otel-demo

jobs:
  validate:
    name: Validate Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        profile: [full, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Download the pinned chart
        run: |
          helm pull opentelemetry-demo \
            --repo "$CHART_REPOSITORY" \
            --version "$CHART_VERSION" \
            --untar --untardir "$RUNNER_TEMP/chart"
      - name: Prepare profile values
        env:
          DEMO_PROFILE: ${{ matrix.profile }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/prepare-profile.py --output .helm/selected-profile-values.yaml
          python3 scripts/prepare-profile.py --profile "$DEMO_PROFILE" --output .helm/profile-values.yaml
      - name: Validate values and render manifests
        run: |
          mkdir -p .helm
          helm lint "$RUNNER_TEMP/chart/opentelemetry-demo" \
            --values .helm/profile-values.yaml --strict
          helm template "$RELEASE" "$RUNNER_TEMP/chart/opentelemetry-demo" \
            --namespace "$NAMESPACE" --values .helm/profile-values.yaml > .helm/rendered.yaml
      - name: Validate alert routing and test alert behavior
        env:
          DEMO_PROFILE: ${{ matrix.profile }}
        run: |
          python3 scripts/check-monitoring.py .helm/rendered.yaml --profile "$DEMO_PROFILE"
          if [[ "$DEMO_PROFILE" == test ]]; then
            python3 scripts/check-test-profile.py .helm/rendered.yaml
          fi

  deploy:
    name: Deploy to Minikube
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, otel-demo]
    environment: local
    timeout-minutes: 35
    env:
      KUBECONFIG: ${{ vars.KUBECONFIG_PATH }}
      KUBE_CONTEXT: otel-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Prepare selected profile
        run: |
          python3 -c 'import yaml; assert yaml.__version__ == "6.0.3", "Install PyYAML 6.0.3 on the runner"'
          python3 scripts/prepare-profile.py --output "$RUNNER_TEMP/profile-values.yaml"
      - name: Check cluster access
        run: |
          test -n "$KUBECONFIG" || { echo "Set the KUBECONFIG_PATH repository variable."; exit 1; }
          test -r "$KUBECONFIG"
          kubectl --context "$KUBE_CONTEXT" --request-timeout=15s get nodes
      - name: Deploy
        env:
          HELM_CACHE_HOME: ${{ runner.temp }}/helm/cache
          HELM_CONFIG_HOME: ${{ runner.temp }}/helm/config
          HELM_DATA_HOME: ${{ runner.temp }}/helm/data
        run: |
          helm upgrade --install "$RELEASE" opentelemetry-demo \
            --repo "$CHART_REPOSITORY" \
            --version "$CHART_VERSION" \
            --namespace "$NAMESPACE" --create-namespace \
            --kube-context "$KUBE_CONTEXT" \
            --values "$RUNNER_TEMP/profile-values.yaml" --reset-values \
            --wait --timeout 10m --rollback-on-failure --history-max 10
